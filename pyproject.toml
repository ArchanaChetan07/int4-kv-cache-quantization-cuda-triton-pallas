[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-decode-int4"
version = "0.1.0"
description = "Flash Decoding with INT4 KV: Fused online softmax + per-channel asymmetric INT4 quantization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Archana Suresh Patil"}
]
keywords = ["cuda", "triton", "pallas", "jax", "tpu", "llm-inference", "llm-serving",
            "kv-cache", "int4-quantization", "flash-attention", "flash-decoding"]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
]
cuda = [
    "torch>=2.0.0",
]
pallas = [
    # jaxlib > 0.4.38 fails to load on some Windows hosts with
    # "DLL load failed while importing _jax"; see docs/TRITON_TO_PALLAS.md 5.5.
    # On Linux / with an accelerator, plain "jax[cpu]" or the TPU wheel works.
    "jax>=0.4.30",
]
llama = [
    "transformers>=4.36.0",   # Cache.update API used by the perplexity harness
    "datasets>=2.0.0",
]

[tool.setuptools]
packages = ["flash_decode_int4"]
package-dir = {"flash_decode_int4" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--verbose --tb=short"
